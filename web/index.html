const HOOKS = {"Market In":1,"Brief In":1,"Voice Note In":1,"Report In":1};
async function runFlow(triggerName, body, resultNode){
  if(HOSTED){
    if(!HOOKS[triggerName]) throw {code:"flow_error", message:"Unknown workflow."};
    const r = await fetch(HOSTED.api + "?op=flow&trigger=" + encodeURIComponent(triggerName), {method:"POST", headers:{"Content-Type":"application/json", "X-Token":store.get("tarazu.token")||""}, body:JSON.stringify(body)});
    const j = await r.json().catch(() => null);
    if(r.status === 401){ store.set("tarazu.token", null); throw {code:"flow_error", message:"Please sign in again."}; }
    if(!r.ok || !j) throw {code:"flow_error", message:(j && j.error) || ("The workflow did not answer (" + r.status + ").")};
    return j;
  }
  if(!S.mcp) throw {code:"no_mcp"};
  const r = await S.mcp.callTool(N8N, "execute_workflow", {workflowId:WF, executionMode:"production", triggerNodeName:triggerName, inputs:{webhookData:{method:"POST", body}}}, {cache:false});
  const p = r.payload || {}; const execId = p.executionId || p.id;
  if(!execId) throw {code:"tool_error", message:"n8n did not start the workflow."};
  for(let i=0;i<50;i++){
    await sleep(i < 3 ? 2500 : 4000);
    const e = await S.mcp.callTool(N8N, "get_workflow_execution", {workflowId:WF, executionId:String(execId), includeData:true, nodeNames:[resultNode], truncateData:1}, {cache:false});
    const x = e.payload || {};
    const run = x.data && x.data.resultData && x.data.resultData.runData && x.data.resultData.runData[resultNode];
    const item = run && run[0] && run[0].data && run[0].data.main && run[0].data.main[0] && run[0].data.main[0][0];
    if(item && item.json) return item.json;
    const st = x.execution && x.execution.status;
    if(st==="error"||st==="crashed"||st==="canceled") throw {code:"flow_error", message:(x.data && x.data.resultData && x.data.resultData.error && (x.data.resultData.error.description || x.data.resultData.error.message)) || "The workflow stopped with an error."};
  }
  throw {code:"timeout"};
}
function fileToBase64(file){ return new Promise((res,rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(",")[1] || ""); fr.onerror = () => rej(fr.error); fr.readAsDataURL(file); }); }
async function fileField(file){
  if(HOSTED){ if(file.size > 12*1024*1024) throw {code:"too_big", message:"File is too large (over 12 MB)."}; return await fileToBase64(file); }
  if(S.fileArgs) return {$file:{data:file, name:file.name || ("note." + ((file.type.split("/")[1]||"m4a").split(";")[0])), type:file.type || "application/octet-stream"}};
  if(file.size > 700*1024) throw {code:"too_big", message:"File is too large to send from here (over 700 KB)."};
  return await fileToBase64(file);
}

function screenHeading(){
  const m = $("#main"); if(!m) return null;
  const h = m.querySelector("h1"); if(!h) return null;
  const card = m.querySelector(".card");
  if(card && (card.compareDocumentPosition(h) & Node.DOCUMENT_POSITION_FOLLOWING)) return null;
  return h;
}
function shellAfter(){
  document.body.classList.toggle("authed", !!S.me);
  const h = S.me ? screenHeading() : null;
  if(h) h.classList.add("in-bar");
  const name = h ? h.textContent.trim() : (S.me ? pageTitle() : "");
  const title = $("#ab-title"); if(title) title.textContent = name;
  if(S.me){ document.title = name + " · Tarazu"; }
  const who = $("#who");
  if(who && S.me) who.innerHTML = `${viaMaster() ? `<span class="chip warn via">Viewing as ${esc(S.me.name)}</span>` : ""}<button class="avatar" data-act="profile" aria-label="Your account: ${esc(S.me.name)}">${esc(initials(S.me.name))}</button>`;
  const fab = $("#fab"), f = S.me ? fabSpec() : null;
  if(fab){
    const dup = f && [...document.querySelectorAll(`#main [data-act="${f.act}"]`)].some(e => e.offsetParent && (!f.id || e.dataset.id === f.id));
    fab.hidden = !f || dup;
    if(f){ fab.dataset.act = f.act; if(f.id) fab.dataset.id = f.id; else delete fab.dataset.id; fab.innerHTML = svg(f.icon) + `<span>${esc(f.label)}</span>`; }
  }
  const sh = $("#sheet"); if(sh && !sh.hidden){ if(!S.me) closeSheet(); else $("#sheet-body").innerHTML = sheetHtml(); }
}

function setTabs(items){
  const t = $("#tabs");
  if(!items){ t.hidden = true; t.innerHTML = ""; return; }
  t.hidden = false;
  const cur = S.route.tab || S.route.name;
  S.tabItems = items;
  t.innerHTML = navBrand() + items.map(([name,label,badge]) => `<button data-act="go" data-route="${name}" ${cur===name?'aria-current="page"':""}><span class="ti">${svg(TAB_ICON[label] || name)}</span><span class="tl">${esc(label)}</span>${badge?`<span class="badge" aria-label="${badge} waiting">${badge}</span>`:""}</button>`).join("");
}
function render(){ renderCore(); shellAfter(); }
function renderCore(){
  if(siteGuard()) return;
  const who = $("#who");
  who.innerHTML = (S.me ? `
    ${HOSTED && "Notification" in window && "serviceWorker" in navigator ? `<button class="ghost sm" data-act="push" title="Notifications on this device">${pushLabel()}</button>` : ""}
    ${viaMaster() ? `<span class="chip warn">Master admin viewing as ${esc(S.me.name)}</span> <button class="sm" data-act="back-master">Back to master</button>` : `${esc(S.me.name)} · ${esc(roleLabel(S.me.role))}`} <button class="ghost sm" data-act="logout">Switch user</button>` : "");
  const ct = $("#client-tag"); if(ct) ct.textContent = S.client && S.me ? " · " + clientName(S.client) : "";
  const clogo = $("#client-logo"); if(clogo) clogo.hidden = !SITE.client;
  const m = $("#main");
  if(S.err.db){ m.innerHTML = `<div class="notice err">${esc(S.err.db)}</div>`; return; }
  if(!S.loaded.users) return;
  if(!S.me){ setTabs(null); m.innerHTML = phoneLoginView(); if(S.draft.focusOtp){ S.draft.focusOtp = false; setTimeout(() => { const e = $("#ph-otp"); if(e) e.focus(); }, 0); } return; }
  const r = S.me.role, rt = S.route.name;
  if(r === "manager"){
    setTabs(V3 ? [["home","Mills"],["rounds","Rounds"],["sales","Sales"]] : [["home","Mills"],["rounds","Rounds"]]);
    m.innerHTML = (V3 && v3Main(rt)) || (rt === "round" ? roundView() : rt === "rounds" ? roundsList() : managerHome());
  } else if(r === "panelist"){
    const pending = S.rounds.filter(x => isOpen(x) && !S.rviews.find(v => v.round_id===x.id && v.panelist_id===S.me.id)).length;
    const needO = V2 && !S.rounds.some(isOpen) && !S.outlooks.find(o => o.day === cycleDay() && o.panelist_id === S.me.id) ? 1 : 0;
    const needP = V3 ? S.polls.filter(p => pollOpen(p) && !myVote(p.id)).length : 0;
    setTabs(V3 ? [["home","Today", pending + needO + needP],["market","Market"],["sales","Sales"]] : [["home", V2 ? "Today" : "Rounds", pending + needO],["market","Market"]]);
    m.innerHTML = (V3 && v3Main(rt)) || (rt === "round" ? roundView() : rt === "market" ? marketPage() : (V2 ? panelistHomeV2() : panelistHome()));
  } else if(isMaster()){
    setTabs([["master","Master"],["client","Client"]]);
    m.innerHTML = rt === "client" ? clientAdminView() : masterView();
  } else {
    const awaiting = S.rounds.filter(x => x.status !== "decided").length;
    setTabs(V3 ? [["home","Home"],["rounds","Rounds", awaiting],["sales","Sales"],["admin","Admin"]] : [["home","Home"],["rounds","Rounds", awaiting],["admin","Admin"], ...(isMaster() ? [["master","Master"]] : [])]);
    m.innerHTML = (V3 && v3Main(rt)) || rt === "round" ? ((V3 && v3Main(rt)) || roundView()) : rt === "rounds" ? roundsList() : rt === "admin" ? adminView() : (rt === "master" && isMaster()) ? masterView() : ownerHome();
  }
  maybeRefreshMarket();
}

async function finishLogin(u){
  if(u.role === "master"){ store.set("tarazu.mid", u.id); if(HOSTED && store.get("tarazu.token")) store.set("tarazu.mtoken", store.get("tarazu.token")); else if(!HOSTED) store.set("tarazu.mtoken", "local"); }
  S.me = u; store.set("tarazu.me", u.id); S.draft = {}; S.err = {}; S.route = {name: u.role === "master" ? "master" : "home"};
  subscribeClient(isMaster() ? (store.get("tarazu.client") || (S.clients[0]||{}).id) : u.client_id);
  if(HOSTED) await S.db._resync(); render(); maybeRefreshMarket(); applyHash();
}

/* ---------- market rail ---------- */
function sparkline(trend){
  const pts = (trend||[]).filter(t => t.karnataka_s30 || t.maharashtra_s30);
  if(pts.length < 3) return "";
  const W = 320, H = 96, pl = 34, pr = 8, pt = 10, pb = 20;
  const vals = pts.flatMap(p => [p.karnataka_s30, p.maharashtra_s30]).filter(Boolean);
  const lo = Math.floor(Math.min(...vals)/50)*50, hi = Math.ceil(Math.max(...vals)/50)*50 || lo+50;
  const X = i => pl + i*(W-pl-pr)/(pts.length-1), Y = v => pt + (hi - v)/(hi-lo||1)*(H-pt-pb);
  const line = key => { let d = "", pen = false; pts.forEach((p,i) => { const v = p[key]; if(v){ d += (pen?"L":"M") + X(i).toFixed(1) + " " + Y(v).toFixed(1) + " "; pen = true; } else pen = false; }); return d; };
  const last = pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="S/30 ex-mill price, last ${pts.length} updates" style="width:100%;height:auto">
    <line x1="${pl}" x2="${W-pr}" y1="${Y(hi)}" y2="${Y(hi)}" stroke="var(--line)"/><line x1="${pl}" x2="${W-pr}" y1="${Y(lo)}" y2="${Y(lo)}" stroke="var(--line)"/>
    <text x="${pl-4}" y="${Y(hi)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${q(hi)}</text><text x="${pl-4}" y="${Y(lo)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${q(lo)}</text>
    <path d="${line("maharashtra_s30")}" fill="none" stroke="var(--jaggery)" stroke-width="1.5"/>
    <path d="${line("karnataka_s30")}" fill="none" stroke="var(--cane)" stroke-width="2.25"/>
    ${last.karnataka_s30?`<circle cx="${X(pts.length-1)}" cy="${Y(last.karnataka_s30)}" r="3.5" fill="var(--cane)"/>`:""}
    <text x="${pl}" y="${H-5}" font-size="10" fill="var(--muted)">${esc(fmtDay(pts[0].date))}</text><text x="${W-pr}" y="${H-5}" font-size="10" fill="var(--muted)" text-anchor="end">${esc(fmtDay(last.date))}</text>
  </svg><div class="small muted"><span style="color:var(--cane);font-weight:700">━</span> South Karnataka S/30 &nbsp; <span style="color:var(--jaggery);font-weight:700">━</span> Maharashtra S/30</div>`;
}

/* ---------- mills table (owner and manager) ---------- */
function totals(ms){ const t = {stock:0, quota:0, sold:0, value:0, bq:0, bs:0, wish:0}; ms.forEach(m => { t.stock += num(m.stock_wh); t.quota += num(m.quota); t.sold += num(m.sold_qty); t.value += num(m.sold_qty)*num(m.sold_avg_price); t.bq += balQuota(m); t.bs += balStock(m); t.wish += num(m.wish_to_sell); }); t.avg = t.sold ? t.value/t.sold : 0; return t; }
function millsTable(editable){
  const ms = millsSorted(), t = totals(ms);
  const inp = (m, k) => `<input data-mill="${esc(m.id)}" data-k="${k}" inputmode="numeric" aria-label="${esc(m.name)} ${k}" value="${has(m[k])?esc(m[k]):""}">`;
  const spotDelta = m => { if(V3) return ""; const s = spotFor(m.state, m.grade); if(!s || !num(m.sold_avg_price)) return ""; const d = num(m.sold_avg_price) - s.mid; return `<span class="sub" title="Against ${esc(s.label)} spot ${inr(s.mid)}">${d>=0?"+":"−"}${q(Math.abs(d))} vs spot</span>`; };
  return `${ms.some(m => m.example)?`<div class="small" style="color:var(--jaggery)">Figures are examples until the mills' real numbers are entered.</div>`:""}<div class="tablewrap"><table class="compact">
    <thead><tr><th>Unit</th><th>Mill name</th><th>Code</th><th class="r">Stock in WH</th><th class="r">Quota</th><th class="r">Sold qty</th><th class="r">Sold avg price</th><th class="r">Bal. quota</th><th class="r">Bal. stock</th>${editable?`<th class="r">${V2 && S.draft.wishUnit === "pct" ? "Wish to sell (% of bal. quota)" : "Wish to sell"}</th>`:""}</tr></thead>
    <tbody>${ms.map(m => `<tr><td class="unit">${esc(m.unit_no)}</td><td class="mname" title="${esc(m.location||"")}">${esc(m.name)}</td><td class="num">${esc(m.code)}</td>
      ${editable?`<td class="r">${inp(m,"stock_wh")}</td><td class="r">${inp(m,"quota")}</td><td class="r">${inp(m,"sold_qty")}</td><td class="r">${inp(m,"sold_avg_price")}</td>`

function roundItem(r){

}
function stanceCount(vs){ const c = {sell:0, some:0, hold:0}; vs.forEach(v => c[vStance(v)]++); return c; }
function miniBar(vs){
  const c = stanceCount(vs), wait = Math.max(0, panelists().length - vs.length);
  return `<div class="pbar" role="img" aria-label="${c.sell} sell now, ${c.some} sell some, ${c.hold} hold, ${wait} waiting">${["sell","some","hold"].map(k => c[k] ? `<div class="st-${k}" style="flex:${c[k]}"></div>` : "").join("")}${wait ? `<div class="wait" style="flex:${wait}"></div>` : ""}</div>`;

function roundItemV2(r){

/* home: a short brief of the latest round (V2) */
function namesList(a){ return a.length <= 1 ? a.join("") : a.slice(0,-1).join(", ") + " and " + a[a.length-1]; }
function rangeTxt(a, f){ const s = a.filter(Boolean).sort((x,y) => x-y); if(!s.length) return ""; return s[0] === s[s.length-1] ? f(s[0]) : `${f(s[0])} to ${f(s[s.length-1])}`; }
function latestBriefV2(r){
  const role = S.me.role, owner = role === "owner" || role === "master";

  const groups = ["sell","some","hold"].map(k => ({k, v:vs.filter(v => vStance(v) === k).sort((x,y) => String(userName(x.panelist_id)).localeCompare(String(userName(y.panelist_id)), undefined, {numeric:true}))})).filter(g => g.v.length);
  const who = groups.map(g => {
    const names = namesList(g.v.map(v => userName(v.panelist_id)));

    return `<div><span class="stchip st-${g.k}">${esc(STANCE_LABEL[g.k])}</span><span class="small">${esc(names)}${pct}${rate ? ` · ${g.k === "hold" ? "would sell at" : "at"} ${rate}` : ""}</span></div>`;
  }).join("");
  const dc = {up:0, flat:0, down:0}; vs.forEach(v => { if(v.direction) dc[v.direction]++; });
  const dirs = Object.entries(dc).filter(([,n]) => n).map(([k,n]) => `${n} ${DIR_ARROW[k]}`).join("  ");
  const b = r.brief;
  const dec = r.status === "decided" && r.decision ? `<div class="readback good"><b>Your decision:</b> ${num(r.decision.total_qty) ? `sell ${qtl(r.decision.total_qty)} at ${inr(r.decision.avg_rate)} avg` : "hold everything"}${r.decision.note ? ` · ${esc(r.decision.note)}` : ""}</div>` : "";
  return `<button class="card item lbrief" data-act="open" data-id="${esc(r.id)}" style="border-color:var(--cane);border-width:2px">
    <div class="row between"><span class="eyebrow">Latest round · brief</span>${roundChip(r)}</div>
    <div class="row between" style="align-items:baseline;gap:8px;flex-wrap:wrap"><h2>${esc(r.title || "Advisory round")}</h2><span class="small muted">${esc(state)}</span></div>
    ${fl.length ? `<div class="flagpills">${fl.map(f => `<span>${esc(f.label)}</span>`).join("")}</div>` : ""}
    ${r.note ? `<div class="mnote"><div class="eyebrow">From the mill manager</div><p class="clamp2">${esc(r.note)}</p></div>` : ""}
    ${askLine(r)}
    ${owner ? `${miniBar(vs)}
      <div class="small muted">${vs.length} of ${ps} advisors in${wait && r.status !== "decided" ? ` · ${wait} waiting` : ""}${dirs ? ` · prices seen: ${dirs}` : ""}</div>
      ${who ? `<div class="who">${who}</div>` : `<div class="small muted">No answers yet.</div>`}
      ${b && (b.summary || b.lean) ? `<div class="aib"><div class="eyebrow">AI brief</div>${b.lean ? `<div class="small"><b>Evidence leans: ${esc(SIDE_LABEL[b.lean.side] || b.lean.side)}.</b></div>` : ""}<p class="small clamp3" style="margin:4px 0 0">${esc(b.summary || "")}</p></div>` : ""}`
    : `<div class="small">${vs.length} of ${ps} advisors have answered.</div>`}
    ${dec}
    <span class="more">Open the round →</span>
  </button>`;
}
function roundChip(r){
  if(r.status === "decided") return `<span class="chip">Decided</span>`;
  if(!isOpen(r)) return `<span class="chip warn">Closed, awaiting decision</span>`;
  return `<span class="chip sell">Open</span>`;

function roundsList(){

/* ---------- panel maths ---------- */
function effFor(v, millId){ const o = (v.overrides||{})[millId] || {}; return { pct: has(o.sell_pct) ? num(o.sell_pct) : num(v.sell_pct), rate: has(o.rate) ? num(o.rate) : num(v.target_rate) }; }
function splitOf(vs, r){
  const sell = vs.filter(v => num(v.sell_pct) >= 50).length, hold = vs.length - sell;
  const close = vs.length >= 2 && Math.abs(sell - hold) <= 1;
  const medPct = median(vs.map(v => num(v.sell_pct))) ?? 0, medRate = median(vs.map(v => num(v.target_rate)).filter(Boolean));
  const wpct = vs.length ? vs.reduce((s,v) => s + num(v.sell_pct)*(CONV[v.conviction]||2), 0) / vs.reduce((s,v) => s + (CONV[v.conviction]||2), 0) : 0;
  return {sell, hold, close, medPct, medRate, wpct};
}
function planText(v, r){
  const wish = (r.mills||[]).reduce((s,m) => s + num(m.wish_to_sell), 0);
  const pct = num(v.sell_pct), now = Math.round(wish*pct/100);
  let s = pct === 0 ? `Hold all ${qtl(wish)} for now.` : pct === 100 ? `Sell all ${qtl(wish)} now` : `Sell ${pct}% (${qtl(now)}) now`;
  if(pct > 0) s += v.target_rate ? ` at ${inr(v.target_rate)}/qtl or better.` : (V3 && bandOf(r)) ? ` within the band, ${bandTxt(r)}/qtl.` : num(r.ask_rate) ? ` at the ask, ${inr(r.ask_rate)}/qtl.` : " at the market rate.";
  if(pct > 0 && pct < 100) s += (v.rest === "stagger" && !V3) ? ` Stagger the remaining ${qtl(wish-now)} in ${num(v.lots)} lots every ${num(v.interval_days)} days.` : ` Hold the remaining ${qtl(wish-now)}.`;
  if(Array.isArray(v.move_range) && (v.direction === "up" || v.direction === "down")) s += ` Expects prices ${v.direction} ${bandLabel(v.move_range).replace("₹","Rs ")}/qtl within ${V3 ? weeksLabel(v.move_days || 7, v.move_unit, v.move_weeks) : daysLabel(v.move_days || 7)} (opinion).`;
  else if(pct < 100 && has(v.expected_move)) s += ` Expects ${v.expected_move>=0?"+":""}${num(v.expected_move)} Rs/qtl over ${num(v.horizon_months)===0.5?"2 weeks":num(v.horizon_months)+" month(s)"} (opinion).`;
  return s;
}
function advCell(v, m){
  if(!v) return `<span class="muted small">Awaiting</span>`;
  const e = effFor(v, m.id), wq = num(m.wish_to_sell), qty = Math.round(wq*e.pct/100);
  const cls = e.pct >= 67 ? "sell" : e.pct <= 33 ? "hold" : "mix";
  const over = (v.overrides||{})[m.id];
  return `<span class="chip ${cls}">${e.pct===0?"Hold":e.pct===100?"Sell all":`Sell ${e.pct}%`}</span>${over?` <span class="chip ex" title="Mill-specific view">mill view</span>`:""}
    ${e.pct>0?`<span class="sub num">${qtl(qty)}${e.rate?` · ${inr(e.rate)}`:""}</span>`:""}${e.pct>0&&e.pct<100?`<span class="sub">${v.rest==="stagger"?"stagger rest":"hold rest"}</span>`:""}`;
}

function roundMillsTable(r){

    <tbody>${ms.map(m => `<tr><td class="unit">Unit ${esc(m.unit_no)}</td><td>${esc(m.name)}</td><td>${esc(m.code)}</td><td class="r">${q(m.quota)}</td><td class="r">${q(m.sold_qty)}</td><td class="r">${q(m.balance_quota)}</td><td class="r"><b>${q(m.wish_to_sell)}</b></td></tr>`).join("")}</tbody>
    <tfoot><tr><td colspan="3">Total</td><td class="r">${q(t.quota)}</td><td class="r">${q(t.sold)}</td><td class="r">${q(t.bq)}</td><td class="r">${q(t.wish)}</td></tr></tfoot></table></div></section>`;

function managerStatus(r){
  const got = new Set(viewsFor(r.id).map(v => v.panelist_id));
  return `<section class="card"><h2>Panel responses</h2><p class="small muted">You can see who has answered, not what they said.</p>
    <div class="ledger">${panelists().map(p => `<div><span>${esc(p.name)}</span><span class="v">${got.has(p.id)?"Responded":"Waiting"}</span></div>`).join("")}</div></section>`;
}
function advisoryReport(r){
  const ms = (r.mills||[]).filter(m => num(m.wish_to_sell)), ps = panelists();
  const vmap = {}; viewsFor(r.id).forEach(v => vmap[v.panelist_id] = v);
  const vs = Object.values(vmap), sp = splitOf(vs, r);

function moneyCard(r){

/* V2: each advisor's plan in rupees, after the cost of holding stock */
function moneyCardV2(r){
  const vs = viewsFor(r.id).slice().sort((a,b) => String(userName(a.panelist_id)).localeCompare(String(userName(b.panelist_id)), undefined, {numeric:true}));
  if(!vs.length) return "";
  const ms = (r.mills||[]).filter(m => num(m.wish_to_sell)), wish = ms.reduce((t,m) => t + num(m.wish_to_sell), 0);
  const p0 = num(r.ask_rate) || refSpot() || 0; if(!p0 || !wish) return "";
  const st = settings(), perMonth = p0 * st.rate / 100 / 12 + st.storage, base = wish * p0;
  const hz = m => { const dd = Math.round(m * 30); return [7,14,30].includes(dd) || dd < 1 ? daysLabel(dd || 7) : dd % 30 === 0 ? `${dd/30} months` : daysLabel(dd); };
  const rows = vs.map(v => {
    let nowQty = 0, nowVal = 0;
    ms.forEach(m => { const e = effFor(v, m.id), qn = num(m.wish_to_sell) * e.pct / 100; nowQty += qn; nowVal += qn * (e.rate || p0); });
    const holdQty = Math.max(0, wish - nowQty), months = num(v.move_days) ? num(v.move_days) / 30 : (num(v.horizon_months) || 1);
    const cost = holdQty * perMonth * months, be = perMonth * months;
    let later = null, why = "";
    if(Array.isArray(v.move_range) && num(v.expected_move)){ later = p0 + num(v.expected_move); why = `they see prices ${v.direction} ${bandLabel(v.move_range)} in ${daysLabel(v.move_days || 7)}${v.move_range[0] !== v.move_range[1] ? ` (taking the middle, ${signed(num(v.expected_move))})` : ""}`; }
    else if(has(v.expected_move) && num(v.expected_move)){ later = p0 + num(v.expected_move); why = `they expect ${signed(num(v.expected_move))}/qtl`; }
    else if(vStance(v) === "hold" && num(v.target_rate)){ later = num(v.target_rate); why = `they would sell at ${inr(later)} (${signed(later - p0)})`; }
    const held = holdQty * (later ?? p0), total = nowVal + held - cost, vsBase = total - base;
    let line;
    if(holdQty < 1) line = `Sells everything now${nowQty && Math.abs(nowVal/nowQty - p0) >= 1 ? ` at about ${inr(nowVal/nowQty)}` : ""}. No holding cost.`;
    else line = later ? `Holding ${qtl(holdQty)} for ${hz(months)} costs ${big(cost)} (${inr(be)}/qtl). Prices must rise ${inr(be)} just to break even; ${why}, so the held part ${later - p0 - be >= 0 ? "gains" : "loses"} about ${big(Math.abs((later - p0 - be) * holdQty))} after cost.`
      : `No price call, so this reads as selling at the ask: the held ${qtl(holdQty)} is valued at ${inr(p0)}, and holding it for ${hz(months)} costs ${big(cost)} (${inr(be)}/qtl).`;
    return {v, nowQty, holdQty, total, vsBase, line};
  });
  const best = rows.reduce((a,b) => b.vsBase > a.vsBase ? b : a, rows[0]);
  return `<section class="card"><h2>The money, per advisor</h2>
    <p class="small muted">Against selling all ${qtl(wish)} now at the ask (${inr(p0)}): <b>${big(base)}</b>. Holding cost is ${st.rate}% a year on ${inr(p0)} plus ${inr(st.storage)}/qtl a month, so <b>${inr(perMonth)} per qtl per month</b>. Held stock is valued at the advisor's own price call, less that cost. No price call means the ask.</p>
    <div class="ledger">${rows.map(x => `<div><span><b>${esc(userName(x.v.panelist_id))}</b> ${stChip(vStance(x.v))} <span class="small">${x.nowQty >= 1 ? `sell ${qtl(x.nowQty)} now` : "sell nothing now"}${x.holdQty >= 1 ? `, hold ${qtl(x.holdQty)}` : ""}</span><br><span class="small muted">${esc(x.line)}</span></span>
      <span class="v">${big(x.total)}<br><span class="small" style="color:${x.vsBase >= 0 ? "var(--cane)" : "var(--danger)"}">${bigSigned(x.vsBase)} vs all now</span></span></div>`).join("")}</div>
    ${rows.length > 1 && best.vsBase > 0 ? `<p class="small">Best on paper: <b>${esc(userName(best.v.panelist_id))}</b>, ${bigSigned(best.vsBase)} against selling all now, if their price call is right.</p>` : rows.length ? `<p class="small">On these numbers no plan beats selling everything now at the ask once holding cost is counted.</p>` : ""}
  </section>`;
}

    : {stance:"", direction:"", sell_pct:50, target_rate: V2 ? "" : num(r && r.ask_rate) ? num(r.ask_rate) : refSpot()?Math.round(refSpot()/10)*10:"", rest:"hold", lots:4, interval_days:3, horizon_months:1, expected_move:"", overrides:{}, reasons:{}, conviction:"medium", note:"", voice:null, mode:"new", change_reason:"", move_band:"", move_exact:"", move_days:7};
  return base;
}
function panelistBlock(r){

function overridesTable(r, d){
  const ms = (r.mills||[]).filter(m => num(m.wish_to_sell));
  return `<div class="tablewrap" style="margin-top:8px"><table><thead><tr><th>Mill</th><th class="r">Wish</th><th class="r">Sell %</th><th class="r">Rate</th></tr></thead><tbody>${ms.map(m => { const o = d.overrides[m.id] || {}; return `<tr><td>Unit ${esc(m.unit_no)} · ${esc(m.name)}</td><td class="r">${q(m.wish_to_sell)}</td><td class="r"><input data-ov="${esc(m.id)}" data-k="sell_pct" inputmode="numeric" placeholder="${num(d.sell_pct)}" value="${has(o.sell_pct)?esc(o.sell_pct):""}"></td><td class="r"><input data-ov="${esc(m.id)}" data-k="rate" inputmode="numeric" placeholder="${esc(d.target_rate)}" value="${has(o.rate)?esc(o.rate):""}"></td></tr>`; }).join("")}</tbody></table></div><p class="small muted">Leave blank to use your overall view.</p>`;
}
function readback(r, d){
  const ms = (r.mills||[]).filter(m => num(m.wish_to_sell)); let now = 0, val = 0, hold = 0;
  ms.forEach(m => { const o = d.overrides[m.id] || {}; const p = has(o.sell_pct) ? num(o.sell_pct) : num(d.sell_pct), rt = has(o.rate) ? num(o.rate) : num(d.target_rate), w = num(m.wish_to_sell); now += w*p/100; val += w*p/100*(rt||refSpot()||0); hold += w - w*p/100; });
  let s = `Sell <b>${qtl(now)}</b> now${val?` (about <b>${big(val)}</b>)`:""}, hold <b>${qtl(hold)}</b>.`;
  const ref = num(d.target_rate) || refSpot();
  if(hold > 0 && has(d.expected_move) && ref){ const m = num(d.horizon_months), c = carry(ref, m), net = num(d.expected_move) - c;
    return `<div class="readback ${net>0?"good":"bad"}">${s}<br>Holding costs about <b>${inr(c)}/qtl</b> over ${m===0.5?"2 weeks":m+" month"+(m===1?"":"s")}. Your expected ${signed(num(d.expected_move))}/qtl nets <b>${signed(net)}/qtl</b>, about <b>${bigSigned(net*hold)}</b> on the held quantity. ${net>0?"Holding pays if you are right.":"On these numbers, waiting does not pay."}</div>`; }
  if(num(d.target_rate) && num(r.ask_rate)){ const g = num(d.target_rate) - num(r.ask_rate); s += `<br>Your target is ${g===0?"the same as":signed(g)+"/qtl against"} the manager's asking price of ${inr(r.ask_rate)}.`; }
  if(num(d.target_rate) && refSpot()){ const gap = num(d.target_rate) - refSpot(); s += `<br>Your target is ${signed(gap)}/qtl against today's S. Karnataka S/30 spot of ${inr(refSpot())}.`; }
  return `<div class="readback">${s}</div>`;
}
function voiceBlock(d){

    <button type="button" id="rec-btn" class="hold-rec${REC.on?" rec":""}" ${busy?"disabled":""}>${busy?`<span class="spin"></span> Transcribing…`:REC.on?"● Recording · let go to finish":(d.voice?"🎙 Hold to record again":"🎙 Hold to record a voice note")}</button>

/* ---------- sales history ---------- */
function salesSummaryForAI(){
  const byMonth = {}; S.sales.forEach(s => { const k = s.month; (byMonth[k] = byMonth[k] || {qty:0, val:0}); byMonth[k].qty += num(s.qty); byMonth[k].val += num(s.qty)*num(s.avg_price); });
  return Object.entries(byMonth).sort().map(([k,v]) => ({month:k, qty:Math.round(v.qty), avg_price:v.qty?Math.round(v.val/v.qty):null}));
}
function salesHistoryCard(){
  if(!S.sales.length) return `<section class="card"><div class="row between"><h2>Sales history</h2><span class="small muted">Last 3 years</span></div><div class="empty">Three years of mill-wise sales will show here once the file is imported in Admin. The AI brief will then compare this month with the same month in past years.</div></section>`;
  const rows = salesSummaryForAI(); const W = 640, H = 180, pl = 44, pr = 10, pt = 12, pb = 28;
  const maxQ = Math.max(...rows.map(r => r.qty)) || 1, prices = rows.map(r => r.avg_price).filter(Boolean), lo = Math.min(...prices)*0.97, hi = Math.max(...prices)*1.03;
  const bw = (W-pl-pr)/rows.length; const Yq = v => pt + (1 - v/maxQ)*(H-pt-pb), Yp = v => pt + (hi - v)/(hi-lo||1)*(H-pt-pb);
  const line = rows.map((r,i) => r.avg_price ? `${i?"L":"M"}${(pl+bw*i+bw/2).toFixed(1)} ${Yp(r.avg_price).toFixed(1)}` : "").join(" ");
  return `<section class="card"><div class="row between"><h2>Sales history</h2><span class="small muted">${rows.length} months, all mills</span></div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Monthly quantity sold and average price">
      ${rows.map((r,i) => `<rect x="${pl+bw*i+1}" y="${Yq(r.qty)}" width="${Math.max(1,bw-2)}" height="${H-pb-Yq(r.qty)}" fill="var(--cane-soft)" stroke="var(--cane)" stroke-width=".5"><title>${esc(r.month)}: ${q(r.qty)} qtl at ${r.avg_price?inr(r.avg_price):"–"}</title></rect>`).join("")}
      <path d="${line}" fill="none" stroke="var(--jaggery)" stroke-width="2"/>
      <text x="${pl-4}" y="${pt+8}" text-anchor="end" font-size="10" fill="var(--muted)">${q(maxQ)}</text>
      <text x="${pl}" y="${H-8}" font-size="10" fill="var(--muted)">${esc(rows[0].month)}</text><text x="${W-pr}" y="${H-8}" font-size="10" fill="var(--muted)" text-anchor="end">${esc(rows[rows.length-1].month)}</text>
    </svg><div class="small muted"><span style="color:var(--cane)">■</span> Quantity sold (qtl) &nbsp; <span style="color:var(--jaggery);font-weight:700">━</span> Average price</div></section>`;
}

const monthKey = iso => String(iso||"").slice(0,7);
function adminView(){
  const months = [...new Set(S.rounds.map(r => monthKey(r.created_at)))].filter(Boolean).sort().reverse();
  const mk = S.route.month || months[0] || new Date().toISOString().slice(0,7);
  const rs = S.rounds.filter(r => monthKey(r.created_at) === mk), dec = rs.filter(r => r.status === "decided");
  const qty = dec.reduce((s,r) => s + num(r.decision.total_qty), 0), val = dec.reduce((s,r) => s + num(r.decision.total_qty)*num(r.decision.avg_rate), 0);
  const trendAvg = (() => { const t = ((S.market&&S.market.trend)||[]).filter(x => x.karnataka_s30 && monthKey(x.date) === mk); return t.length ? t.reduce((s,x) => s + x.karnataka_s30, 0)/t.length : null; })();
  let outcome = 0, scored = 0;
  dec.forEach(r => { const p30 = r.price_after && num(r.price_after.d30); if(!p30) return; scored++; const wish = (r.mills||[]).reduce((s,m)=>s+num(m.wish_to_sell),0), sold = num(r.decision.total_qty), held = wish - sold, rate = num(r.decision.avg_rate)||p30, c = carry(rate,1); outcome += sold*(rate - p30 + c) + held*(p30 - rate - c); });
  return `<div class="row between"><h1>Admin</h1><label style="flex-direction:row;align-items:center;gap:8px">Month<select id="ad-month">${(months.length?months:[mk]).map(m => `<option value="${m}" ${m===mk?"selected":""}>${esc(monthLabel(m))}</option>`).join("")}</select></label></div>
  ${rs.some(r => r.example)?`<div class="notice">This month includes example rounds so the console has something to show. Clear them under Management.</div>`:""}
  <section class="card"><h2>${esc(monthLabel(mk))} at a glance</h2>
    <div class="stat"><div><div class="n num">${rs.length}</div><div class="l">Advisory rounds</div></div><div><div class="n num">${dec.length}</div><div class="l">Decided</div></div>
      <div><div class="n num">${q(qty)}</div><div class="l">Quintals approved to sell</div></div><div><div class="n num">${qty?inr(val/qty):"–"}</div><div class="l">Avg approved rate${trendAvg?` · spot avg ${inr(trendAvg)}`:""}</div></div></div>
    <div class="readback ${outcome>=0?"good":"bad"}">${scored?`Against the S. Karnataka S/30 price 30 days after each decision, net of holding cost, this month's decisions ${outcome>=0?"saved":"cost"} about <b>${big(Math.abs(outcome))}</b> across ${scored} scored round${scored===1?"":"s"}.`:"Enter the S/30 price 15 and 30 days after each decision in the round log to score the month."}</div></section>
  ${scorecard(dec)}
  <section class="card"><h2>Round log</h2><p class="small muted">Prices after are S. Karnataka S/30, entered until the live price feed fills them in.</p>
    <div class="tablewrap"><table><thead><tr><th>Date</th><th class="r">Wish</th><th>Panel</th><th>AI</th><th class="r">Approved</th><th class="r">Rate</th><th class="r">After 15d</th><th class="r">After 30d</th>${V3?"<th></th>":""}</tr></thead><tbody>
    ${rs.length?rs.map(r => { const vs = viewsFor(r.id), sp = splitOf(vs, r); return `<tr><td>${esc(fmtDay(r.created_at))}${r.example?" *":""}</td><td class="r">${q((r.mills||[]).reduce((s,m)=>s+num(m.wish_to_sell),0))}</td><td>${vs.length?`median ${Math.round(sp.medPct)}%`:"–"}</td><td>${r.brief&&r.brief.lean?esc(SIDE_LABEL[r.brief.lean.side]||""):r.brief?"Summary":"–"}</td><td class="r">${r.decision?q(r.decision.total_qty):"Open"}</td><td class="r">${r.decision&&r.decision.total_qty?inr(r.decision.avg_rate):"–"}</td>
      <td class="r"><input aria-label="Price after 15 days" data-pa="${esc(r.id)}" data-k="d15" inputmode="numeric" value="${esc(r.price_after&&r.price_after.d15||"")}"></td><td class="r"><input aria-label="Price after 30 days" data-pa="${esc(r.id)}" data-k="d30" inputmode="numeric" value="${esc(r.price_after&&r.price_after.d30||"")}"></td>${V3?`<td class="r">${delRoundBtn(r, true)}</td>`:""}</tr>`; }).join(""):`<tr><td colspan="8" class="muted">No rounds this month.</td></tr>`}
    </tbody></table></div>${rs.some(r => r.example)?`<p class="small muted">* Example round</p>`:""}</section>

}
function scorecard(dec){
  const rows = panelists().map(p => {
    const vs = S.rviews.filter(v => v.panelist_id === p.id && dec.find(r => r.id === v.round_id));
    const times = vs.map(v => { const r = S.rounds.find(x => x.id === v.round_id), f = (v.versions||[])[0]; return f && r ? (new Date(f.at) - new Date(r.created_at))/3600e3 : null; }).filter(x => x!=null && x>=0).sort((a,b)=>a-b);
    const med = times.length ? times[Math.floor(times.length/2)] : null;
    let hits = 0, scored = 0, agree = 0, rateGap = [];
    vs.forEach(v => { const r = S.rounds.find(x => x.id === v.round_id), wish = (r.mills||[]).reduce((s,m)=>s+num(m.wish_to_sell),0), ownerPct = wish ? num(r.decision.total_qty)/wish*100 : 0;
      if(Math.abs(ownerPct - num(v.sell_pct)) <= 15) agree++;
      const p30 = r.price_after && num(r.price_after.d30); if(v.target_rate && p30) rateGap.push(num(v.target_rate) - p30);
      if(!p30) return; const ref = num(r.decision.avg_rate) || num(v.target_rate) || p30; const gain = p30 - ref - carry(ref,1);
      scored++; if((num(v.sell_pct) >= 50) === (gain <= 0)) hits++; });
    const changed = vs.filter(v => (v.versions||[]).some(h => h.kind === "change")).length;
    const mg = median(rateGap);
    return `<tr><td>${esc(p.name)}</td><td class="r">${vs.length}</td><td class="r">${med==null?"–":med<1?Math.round(med*60)+" min":med.toFixed(1)+" h"}</td><td class="r">${changed}</td><td class="r">${scored?Math.round(hits/scored*100)+"%":"–"}</td><td class="r">${mg==null?"–":signed(mg)}</td><td class="r">${vs.length?Math.round(agree/vs.length*100)+"%":"–"}</td></tr>`;
  });
  return `<section class="card"><h2>Advisor scorecard</h2><p class="small muted">Hit rate checks each call against the price 30 days later, net of holding cost. Rate gap: target rate against that later price.</p>
    <div class="tablewrap"><table><thead><tr><th>Advisor</th><th class="r">Calls</th><th class="r">Median reply</th><th class="r">Changed</th><th class="r">Hit rate</th><th class="r">Rate gap</th><th class="r">Agreed with you</th></tr></thead><tbody>${rows.join("")||`<tr><td colspan="7" class="muted">No advisors yet.</td></tr>`}</tbody></table></div></section>`;
}

/* ---------- latest round on top ---------- */
function latestRoundCard(){
  const r = S.rounds[0]; if(!r) return "";
  if(V2) return latestBriefV2(r);
  const vs = viewsFor(r.id), sp = splitOf(vs, r), ms = (r.mills||[]).filter(m => num(m.wish_to_sell));
  const wish = ms.reduce((s,m) => s + num(m.wish_to_sell), 0);
  const medQty = vs.length ? ms.reduce((s,m) => s + num(m.wish_to_sell)*(median(vs.map(v => effFor(v,m.id).pct))||0)/100, 0) : 0;
  const state = r.status === "decided" ? `Decided: ${qtl(r.decision.total_qty)} at ${r.decision.total_qty?inr(r.decision.avg_rate):"–"}` : isOpen(r) ? `Open until ${fmtDate(r.valid_until)}` : "Closed, awaiting the owner's decision";
  return `<button class="card item" data-act="open" data-id="${esc(r.id)}" style="border-color:var(--cane);border-width:2px">
    <div class="row between"><span class="eyebrow">Latest advisory round</span>${roundChip(r)}</div>
    <div class="row between" style="align-items:baseline"><h2>${esc(r.title||"Advisory round")}</h2><span class="small muted">${esc(state)}</span></div>

      <div><div class="n num">${vs.length?Math.round(sp.medPct)+"%":"–"}</div><div class="l">Median share to sell${sp.medRate?` at ${inr(sp.medRate)}`:""}</div></div>
      <div><div class="n num">${vs.length?q(medQty):"–"}</div><div class="l">Panel median quantity, qtl</div></div></div>
    ${r.brief && r.brief.summary ? `<span class="small">${esc(r.brief.summary)}</span>` : ""}
    ${sp.close && vs.length ? `<span class="chip warn" style="align-self:flex-start">Close split</span>` : ""}

}

/* ---------- price band ---------- */
function bandOf(r){
  if(!r) return null;
  const lo = num(r.band_min) || num(r.floor_rate) || num(r.ask_rate), hi = num(r.band_max) || num(r.ask_rate) || lo;
  if(!lo && !hi) return null;
  return [Math.min(lo || hi, hi || lo), Math.max(lo || hi, hi || lo)];
}
const bandMid = r => { const b = bandOf(r); return b ? Math.round((b[0] + b[1]) / 2) : 0; };
const bandTxt = r => { const b = bandOf(r); return !b ? "–" : b[0] === b[1] ? inr(b[0]) : `${inr(b[0])}–${q(b[1])}`; };
const askLineV3 = r => bandOf(r) ? `<div class="askline"><span class="small muted">Price band</span><span class="big num">${bandTxt(r)}</span><span class="small muted">per qtl, M/30</span></div>` : "";
/* rounds close at 4 PM; one posted after 4 PM closes two hours after posting */
function closeTimeV3(){ const now = Date.now(), d = new Date(now + IST_MS); const four = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), 16, 0) - IST_MS; return new Date(now < four - 15*60e3 ? four : now + 2*3600e3); }

/* ---------- timeframe in weeks ---------- */
const WEEK_BTNS = [[7,"1 week"],[14,"2 weeks"],[21,"3 weeks"],[28,"4 weeks"]];
function weeksLabel(days, unit, weeks){ const dd = num(days) || 7; if(unit === "d") return dd === 1 ? "1 day" : `${dd} days`; const w = num(weeks) > 0 ? num(weeks) : Math.round(dd / 7 * 10) / 10; return w === 1 ? "1 week" : `${w} weeks`; }
function v3Within(d){
  const cur = num(d.move_days || 7), custom = !!String(d.move_customTxt || "").trim() || d.move_unit === "d" || !WEEK_BTNS.some(x => x[0] === cur);
  return `<div class="small muted">Within</div>
  <div class="seg">${WEEK_BTNS.map(([n,l]) => `<button type="button" data-act="mdays" data-k="${n}" aria-pressed="${!custom && cur === n}">${l}</button>`).join("")}</div>
  <div class="row small" style="gap:8px;align-items:center"><span>Or</span><input id="d-mvcustom" inputmode="decimal" maxlength="5" aria-label="Custom timeframe" placeholder="${d.move_unit === "d" ? "e.g. 10" : "e.g. 1.5"}" value="${esc(d.move_customTxt || "")}" style="width:84px;min-height:38px">
  <div class="seg" role="group" style="gap:4px">${[["w","Weeks"],["d","Days"]].map(([k,l]) => `<button type="button" class="sm" data-act="mvunit" data-k="${k}" aria-pressed="${(d.move_unit === "d" ? "d" : "w") === k}" style="min-height:32px;padding:4px 10px;font-size:13px">${l}</button>`).join("")}</div></div>`;
}
function v3CustomDays(d){ const v = parseFloat(String(d.move_customTxt || "").replace(",", ".")); if(!(v > 0)) return 0; return Math.max(1, Math.min(365, Math.round(d.move_unit === "d" ? v : v * 7))); }

/* ---------- labels with the share for "Sell some" ---------- */

const avgSellPct = list => { const xs = list.filter(e => e && (e.stance || vStance(e))).map(e => { const st = e.stance || vStance(e); return st === "sell" ? 100 : st === "hold" ? 0 : (num(e.pct ?? e.sell_pct) > 0 ? num(e.pct ?? e.sell_pct) : 50); }); return xs.length ? Math.round(xs.reduce((s,x) => s + x, 0) / xs.length) : null; };

/* ---------- where each advisor would sell, against the band ---------- */
function priceStripV3(r, vs){
  const b = bandOf(r), mid = bandMid(r);
  const pts = vs.map(v => { const nm = String(userName(v.panelist_id) || ""), mm = nm.match(/\d+/); return {x:num(v.target_rate) || mid, s:vStance(v), p:Math.round(num(v.sell_pct)), n:nm, tag:mm ? mm[0] : nm.charAt(0).toUpperCase(), own:!!num(v.target_rate)}; }).filter(p => p.x);
  const all = [...pts.map(p => p.x), ...(b || [])].filter(Boolean); if(!pts.length || all.length < 2) return "";
  let lo = Math.min(...all), hi = Math.max(...all); const pad = Math.max(20, (hi - lo) * 0.15); lo -= pad; hi += pad;
  const W = 640, pl = 16, pr = 16, R = 10, GAP = 2 * R + 2, X = v => pl + (v - lo) / (hi - lo) * (W - pl - pr);
  const lv = []; pts.sort((u, w) => u.x - w.x);
  pts.forEach(p => { p.cx = X(p.x); let i = 0; while((lv[i] = lv[i] || []).some(c => Math.abs(c - p.cx) < GAP)) i++; lv[i].push(p.cx); p.lvl = i; });
  const Y0 = 8 + R + Math.max(0, lv.length - 1) * GAP, rA = Y0 + 32, rB = Y0 + 52, rC = Y0 + 68, H = Y0 + 76;
  const halo = 'paint-order="stroke" stroke="var(--card)" stroke-width="4" stroke-linejoin="round"';
  const dots = pts.map(p => `<circle class="st-${p.s}" cx="${p.cx.toFixed(1)}" cy="${Y0 - p.lvl * GAP}" r="${R}" style="fill:var(--c)" stroke="var(--card)" stroke-width="2"><title>${esc(p.n)}: ${esc(STANCE_LABEL[p.s])}${p.s==="some"?" "+p.p+"%":""} at ${inr(p.x)}${p.own?"":" (no price given, shown at the band middle)"}</title></circle><text x="${p.cx.toFixed(1)}" y="${Y0 - p.lvl * GAP + 4}" text-anchor="middle" font-size="11" font-weight="800" fill="${p.s==="some" ? "#3d2f00" : "#fff"}" style="pointer-events:none">${esc(p.tag)}</text>`).join("");
  const groups = {}; pts.forEach(p => { const k = p.own ? Math.round(p.x) : "np"; groups[k] = groups[k] || {cx:p.cx, t:p.own ? inr(p.x) : "no price", np:!p.own}; });
  const ends = [-1e9, -1e9], rows = [rB, rC];
  const plabels = Object.values(groups).sort((u, w) => u.cx - w.cx).map(g => { const w = g.t.length * 7.4 + 10; let k = ends[0] < g.cx - w / 2 ? 0 : (ends[1] < g.cx - w / 2 ? 1 : 0); ends[k] = g.cx + w / 2; const y = rows[k];
    return `<line x1="${g.cx.toFixed(1)}" x2="${g.cx.toFixed(1)}" y1="${Y0 + R + 1}" y2="${y - 13}" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="2 3"/><text x="${g.cx.toFixed(1)}" y="${y}" text-anchor="middle" font-size="13" font-weight="700" ${g.np ? 'font-style="italic" fill="var(--muted)"' : 'fill="currentColor"'} ${halo}>${g.t}</text>`; }).join("");
  let band = "";
  if(b){ const x0 = X(b[0]), x1 = X(b[1]), two = b[1] !== b[0] && x1 - x0 >= 150, one = b[1] !== b[0] ? "Band " + inr(b[0]) + "–" + q(b[1]) : "Band " + inr(b[0]);
    const tick = x => `<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${Y0 + 9}" y2="${rA - 14}" stroke="var(--cane)" stroke-width="2"/>`;
    const lab = (x, t, anc) => `<text x="${x.toFixed(1)}" y="${rA}" text-anchor="${anc}" font-size="13" font-weight="800" fill="var(--cane)" ${halo}>${t}</text>`;
    band = `<rect x="${x0.toFixed(1)}" y="${Y0 - 9}" width="${Math.max(3, x1 - x0).toFixed(1)}" height="18" rx="4" fill="var(--cane-soft)" stroke="var(--cane)" stroke-width="1"/>`
      + (two ? tick(x0) + tick(x1) + lab(x0, "Band start " + inr(b[0]), "middle") + lab(x1, "Band end " + inr(b[1]), "middle") : tick((x0 + x1) / 2) + lab((x0 + x1) / 2, one, "middle")); }
  return `<div><div class="eyebrow">Where each advisor would sell, against the band</div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Advisors' prices against the price band" style="width:100%;height:auto;color:var(--ink,inherit)">
    <line x1="${pl}" x2="${W-pr}" y1="${Y0}" y2="${Y0}" stroke="var(--line)" stroke-width="2"/>
    ${band}${plabels}${dots}</svg>
    <div class="small muted">Numbered dots are advisors. Colour = their answer. The price under each dot is the price that advisor gave, so equal prices line up. The box is the price band, with its start and end shown beneath it. An advisor with no price sits at the middle of the band.</div></div>`;
}

/* ---------- the money, per advisor, without holding cost ---------- */
function moneyCardV3(r){
  const vs = viewsFor(r.id).slice().sort((a,b) => String(userName(a.panelist_id)).localeCompare(String(userName(b.panelist_id)), undefined, {numeric:true}));
  if(!vs.length) return "";
  const ms = (r.mills||[]).filter(m => num(m.wish_to_sell)), wish = ms.reduce((t,m) => t + num(m.wish_to_sell), 0);
  const mid = bandMid(r) || refSpot() || 0; if(!mid || !wish) return "";
  const base = wish * mid;
  const rows = vs.map(v => {
    let nowQty = 0, nowVal = 0;
    ms.forEach(m => { const e = effFor(v, m.id), qn = num(m.wish_to_sell) * e.pct / 100; nowQty += qn; nowVal += qn * (e.rate || mid); });
    const holdQty = Math.max(0, wish - nowQty);
    let later = mid, why = "";
    if(Array.isArray(v.move_range) && num(v.expected_move)){ later = mid + num(v.expected_move); why = `they see prices ${v.direction} ${bandLabel(v.move_range)} in ${weeksLabel(v.move_days || 7, v.move_unit, v.move_weeks)}`; }
    else if(vStance(v) === "hold" && num(v.target_rate)){ later = num(v.target_rate); why = `they would sell at ${inr(later)}`; }
    const diff = nowVal + holdQty * later - base;
    const line = holdQty < 1 ? `Sells everything now${nowQty && Math.abs(nowVal/nowQty - mid) >= 1 ? ` at about ${inr(nowVal/nowQty)}` : " at the band middle"}.`
      : later !== mid ? `Holds ${qtl(holdQty)}; ${why}, so the held part is ${signed(later - mid)}/qtl against the band middle.` : `Holds ${qtl(holdQty)} with no price call, so it is valued at the band middle.`;
    return {v, nowQty, holdQty, diff, line};
  });
  const best = rows.reduce((a,b) => b.diff > a.diff ? b : a, rows[0]);
  return `<section class="card"><h2>The money, per advisor</h2>
    <p class="small muted">Against selling all ${qtl(wish)} now at the band middle (${inr(mid)}): <b>${big(base)}</b>. Each advisor's held stock is valued at their own price call.</p>
    <div class="ledger">${rows.map(x => `<div><span><b>${esc(userName(x.v.panelist_id))}</b> ${stChipV(x.v)} <span class="small">${x.nowQty >= 1 ? `sell ${qtl(x.nowQty)} now` : "sell nothing now"}${x.holdQty >= 1 ? `, hold ${qtl(x.holdQty)}` : ""}</span><br><span class="small muted">${esc(x.line)}</span></span>
      <span class="v" style="color:${x.diff > 0.5 ? "var(--cane)" : x.diff < -0.5 ? "var(--danger)" : "var(--muted)"}"><b>${Math.abs(x.diff) < 1 ? "₹0" : bigSigned(x.diff)}</b><br><span class="small muted">if you follow them</span></span></div>`).join("")}</div>
    ${rows.length > 1 && best.diff > 0 ? `<p class="small">Most on paper: <b>${esc(userName(best.v.panelist_id))}</b>, ${bigSigned(best.diff)} against selling all now, if their price call is right.</p>` : ""}
    <p class="small muted">Holding cost is not counted.</p></section>`;
}

/* every sale record, plus imported monthly totals for months that have no daily records */
function salesRows(){
  const rows = S.ledger.filter(x => x.date && num(x.qty) > 0).map(x => ({date:String(x.date).slice(0,10), mill:x.mill_id || "", code:String(x.mill_code || ""), name:x.mill_name || "", qty:num(x.qty), rate:num(x.rate)}));

    rows.push({date:s.month + "-15", mill:mm ? mm.id : "", code:mm ? mm.code : String(s.mill || ""), name:mm ? mm.name : String(s.mill || "All mills"), qty:num(s.qty), rate:num(s.avg_price), monthly:true}); });
  return rows;

const SPERIODS = [["1m","1 month",30],["3m","3 months",91],["6m","6 months",182],["1y","1 year",365],["3y","3 years",1095],["all","All",0],["custom","Custom",0]];
function salesFilter(){
  const d = S.draft, P = d.sp || "3m", mill = d.smill || "all", to = P === "custom" && d.sto ? d.sto : todayIST();
  const per = SPERIODS.find(x => x[0] === P) || SPERIODS[1];
  const from = P === "custom" ? (d.sfrom || "2000-01-01") : per[2] ? new Date(Date.parse(to + "T00:00:00Z") - (per[2] - 1) * 86400e3).toISOString().slice(0,10) : "2000-01-01";
  const mm = S.mills.find(m => m.id === mill);
  const rows = salesRows().filter(r => r.date >= from && r.date <= to && (mill === "all" || r.mill === mill || (mm && (r.code === mm.code || r.name === mm.name))));
  return {P, mill, from, to, rows};
}
function bucketKey(date, unit){
  if(unit === "day") return date;
  if(unit === "month") return date.slice(0,7) + "-01";
  const t = new Date(date + "T00:00:00Z"), wd = (t.getUTCDay() + 6) % 7; return new Date(t.getTime() - wd * 86400e3).toISOString().slice(0,10);
}
function seriesOf(rows, unit){
  const m = {}; rows.forEach(r => { const k = bucketKey(r.date, unit); (m[k] = m[k] || {k, qty:0, val:0}); m[k].qty += r.qty; m[k].val += r.qty * r.rate; });
  return Object.values(m).sort((a,b) => a.k.localeCompare(b.k)).map(x => ({k:x.k, qty:x.qty, avg:x.qty ? x.val / x.qty : 0}));
}
function salesChart(series, kind, unit){
  if(series.length < 2) return `<div class="empty">Not enough sales in this period for a chart.</div>`;
  const W = 720, H = 230, pl = 58, pr = kind === "combo" ? 58 : 14, pt = 16, pb = 30, n = series.length;
  const X = i => pl + (n === 1 ? (W - pl - pr) / 2 : i * (W - pl - pr) / (n - 1));
  const bw = Math.max(2, Math.min(26, (W - pl - pr) / n * 0.7));
  const qmax = Math.max(...series.map(s => s.qty)) * 1.1 || 1, pv = series.map(s => s.avg).filter(Boolean);
  let plo = Math.min(...pv), phi = Math.max(...pv); const pp = Math.max(20, (phi - plo) * 0.15); plo = Math.floor((plo - pp) / 10) * 10; phi = Math.ceil((phi + pp) / 10) * 10;
  const Yq = v => pt + (1 - v / qmax) * (H - pt - pb), Yp = v => pt + (phi - v) / (phi - plo || 1) * (H - pt - pb);
  const fmtK = s => unit === "month" ? new Date(s + "T12:00:00Z").toLocaleDateString("en-IN", {month:"short", year:"2-digit", timeZone:"UTC"}) : new Date(s + "T12:00:00Z").toLocaleDateString("en-IN", {day:"numeric", month:"short", timeZone:"UTC"});
  const idx = [0, Math.floor((n - 1) / 2), n - 1];
  const xlab = idx.map(i => `<text x="${X(i).toFixed(1)}" y="${H - 8}" font-size="11" fill="var(--muted)" text-anchor="${i === 0 ? "start" : i === n - 1 ? "end" : "middle"}">${esc(fmtK(series[i].k))}</text>`).join("");
  const grid = [0, 0.5, 1].map(f => { const y = pt + f * (H - pt - pb); return `<line x1="${pl}" x2="${W - pr}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)"/>`; }).join("");
  const leftAxis = kind === "price" ? [phi, (phi + plo) / 2, plo].map((v,i) => `<text x="${pl - 6}" y="${(pt + i * (H - pt - pb) / 2 + 4).toFixed(1)}" font-size="11" fill="var(--muted)" text-anchor="end">${q(v)}</text>`).join("")
    : [qmax, qmax / 2, 0].map((v,i) => `<text x="${pl - 6}" y="${(pt + i * (H - pt - pb) / 2 + 4).toFixed(1)}" font-size="11" fill="var(--muted)" text-anchor="end">${v >= 1000 ? q(v / 1000) + "k" : q(v)}</text>`).join("");
  const rightAxis = kind === "combo" ? [phi, (phi + plo) / 2, plo].map((v,i) => `<text x="${W - pr + 6}" y="${(pt + i * (H - pt - pb) / 2 + 4).toFixed(1)}" font-size="11" fill="var(--cane)">${q(v)}</text>`).join("") : "";
  const bars = kind !== "price" ? series.map((s,i) => `<rect x="${(X(i) - bw / 2).toFixed(1)}" y="${Yq(s.qty).toFixed(1)}" width="${bw.toFixed(1)}" height="${(H - pb - Yq(s.qty)).toFixed(1)}" rx="2" fill="${kind === "combo" ? "var(--indigo-soft)" : "var(--indigo)"}"><title>${esc(fmtK(s.k))}: ${qtl(s.qty)}</title></rect>`).join("") : "";
  const line = kind !== "qty" ? (() => { let dd = ""; series.forEach((s,i) => { if(s.avg) dd += (dd ? "L" : "M") + X(i).toFixed(1) + " " + Yp(s.avg).toFixed(1) + " "; }); return `<path d="${dd}" fill="none" stroke="var(--cane)" stroke-width="2.25"/>` + series.map((s,i) => s.avg ? `<circle cx="${X(i).toFixed(1)}" cy="${Yp(s.avg).toFixed(1)}" r="${n > 60 ? 1.5 : 3}" fill="var(--cane)"><title>${esc(fmtK(s.k))}: ${inr(s.avg)} avg${kind === "combo" ? ", " + qtl(s.qty) : ""}</title></circle>` : "").join(""); })() : "";
  const titles = {price:"Average price, ₹/qtl", qty:"Quantity sold, qtl", combo:"Quantity (bars, left) and average price (line, right)"};
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${titles[kind]}" style="width:100%;height:auto">${grid}${leftAxis}${rightAxis}${bars}${line}${xlab}</svg>`;
}

function parseDateDMY(s){
  s = String(s || "").trim(); let m;
  if((m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/))){ const y = m[3].length === 2 ? "20" + m[3] : m[3]; return `${y}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`; }
  if((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return `${m[1]}-${m[2]}-${m[3]}`;
  const d = new Date(s); return isNaN(d) ? null : new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0,10);
}
async function importLedger(file){
  S.err.sales = ""; S.draft.importNote = "";
  try{
    const text = await file.text(); const lines = text.replace(/^﻿/, "").split(/\r?\n/).filter(l => l.trim()); if(lines.length < 2) throw new Error("The file has no data rows.");
    const split = l => { const out = []; let cur = "", qd = false; for(const ch of l){ if(ch === '"'){ qd = !qd; } else if(ch === "," && !qd){ out.push(cur.trim()); cur = ""; } else cur += ch; } out.push(cur.trim()); return out; };
    const head = split(lines[0]).map(h => h.toLowerCase().trim());
    const find = re => head.findIndex(h => re.test(h));
    const iD = find(/^date|day/), iC = find(/code/), iN = head.findIndex((h,i) => i !== iC && /mill|unit|factory|name/.test(h)), iQ = find(/quantity|qty|sold/), iR = find(/rate|price/), iG = find(/grade/), iB = find(/buyer/), iX = find(/note/);
    if(iD < 0 || iQ < 0 || iR < 0 || (iC < 0 && iN < 0)) throw new Error("Columns needed: Date, Mill code or Mill name, Quantity sold (qtl), Rate (Rs/qtl). Download the sample file to see the layout.");
    const items = [], skipped = [], monthly = {};
    lines.slice(1).forEach((l, k) => { const c = split(l), row = k + 2;
      const date = parseDateDMY(c[iD]); if(!date){ skipped.push(`row ${row}: date not readable`); return; }
      const qn = Math.round(pnum(c[iQ])), rate = Math.round(pnum(c[iR])); if(qn <= 0){ skipped.push(`row ${row}: no quantity`); return; } if(rate <= 0){ skipped.push(`row ${row}: no rate`); return; }
      const code = iC >= 0 ? String(c[iC] || "").trim() : "", name = iN >= 0 ? String(c[iN] || "").trim() : "";
      const m = S.mills.find(x => (code && String(x.code) === code) || (name && String(x.name).toLowerCase() === name.toLowerCase()));
      const key = (m ? m.id : (code || name).replace(/[^\w-]/g, "")) || "mill";
      items.push({path:cp(`ledger/${date}_${key}_csv${row}`), data:{date, mill_id:m ? m.id : "", mill_code:m ? m.code : code, mill_name:m ? m.name : name, qty:qn, rate, grade:iG >= 0 && c[iG] ? c[iG] : "M/30", buyer:iB >= 0 ? c[iB] || "" : "", notes:iX >= 0 ? c[iX] || "" : "", source:"csv", created_at:new Date().toISOString()}});
      const mk = date.slice(0,7) + "_" + key; (monthly[mk] = monthly[mk] || {month:date.slice(0,7), mill:m ? m.code : (code || name), qty:0, val:0}); monthly[mk].qty += qn; monthly[mk].val += qn * rate;
    });
    if(!items.length) throw new Error("No rows could be read. " + skipped.slice(0, 3).join("; "));
    Object.entries(monthly).forEach(([k,v]) => items.push({path:cp("sales/" + k), data:{month:v.month, mill:v.mill, qty:Math.round(v.qty), avg_price:Math.round(v.val / v.qty)}}));
    if(HOSTED){ for(let i = 0; i < items.length; i += 400) await S.db._call("bulk", {items:items.slice(i, i + 400)}); await S.db._resync(); }
    else for(const it of items) await save(it.path, it.data);
    const n = items.length - Object.keys(monthly).length;
    S.draft.importNote = `Imported ${q(n)} sales.${skipped.length ? ` Skipped ${skipped.length}: ${esc(skipped.slice(0, 5).join("; "))}${skipped.length > 5 ? "…" : ""}` : ""}`;
    toast(`Imported ${q(n)} sales`); render();
  }catch(err){ S.err.sales = err.message || "Could not read that file."; render(); }
}

/* ---------- push notifications (hosted site only) ---------- */
function pushLabel(){ const p = ("Notification" in window) ? Notification.permission : "denied"; return p === "granted" && store.get("tarazu.push") === "on" ? "🔔 On" : "🔔 Notify me"; }
function b64uToBytes(s){ const pad = "=".repeat((4 - s.length % 4) % 4); const b = atob((s + pad).replace(/-/g,"+").replace(/_/g,"/")); return Uint8Array.from(b, c => c.charCodeAt(0)); }
async function enablePush(){
  try{
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent), standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;
    if(isIOS && !standalone){ toast("On iPhone: tap Share, then Add to Home Screen, open Tarazu from there and tap Notify me."); return; }
    const perm = await Notification.requestPermission();
    if(perm !== "granted"){ toast("Notifications are blocked for this site. Allow them in the browser settings."); return; }
    const reg = await navigator.serviceWorker.register("sw.js");
    await navigator.serviceWorker.ready;
    const {key} = await S.db._call("vapid", {});
    let sub = await reg.pushManager.getSubscription();
    if(!sub) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64uToBytes(key)});
    await S.db._call("subscribe", {subscription:sub.toJSON(), ua:navigator.userAgent.slice(0,120)});
    store.set("tarazu.push", "on"); toast("Notifications are on for this device"); render();
  }catch(e){ toast("Could not turn on notifications: " + (e.message || e)); }
}

/* ---------- hosted data layer: same interface as the artifact store, over api.php ---------- */
function restDb(api){
  const cache = new Map(), subs = new Set(); let since = 0, timer = null, ready = false;
  const call = async (op, body) => {
    const r = await fetch(api + "?op=" + op, {method:"POST", headers:{"Content-Type":"application/json", "X-Token":store.get("tarazu.token")||""}, body:JSON.stringify(body||{})});
    const j = await r.json().catch(() => ({}));
    if(r.status === 401 && op !== "login"){ store.set("tarazu.token", null); }
    if(!r.ok || j.error) throw {message:j.error || ("Server error " + r.status), status:r.status};
    return j;
  };
  const parent = p => p.split("/").slice(0,-1).join("/");
  const notify = () => subs.forEach(fn => { try{ fn(); }catch(e){} });
  async function sync(){
    try{ const j = await call("sync", {since}); (j.docs||[]).forEach(d => { if(d.deleted) cache.delete(d.path); else cache.set(d.path, d.data); }); since = j.now || since; if((j.docs||[]).length || !ready){ ready = true; notify(); } }
    catch(e){ if(!ready){ ready = true; notify(); } }
  }
  function start(){ if(timer) return; sync(); timer = setInterval(sync, 8000); document.addEventListener("visibilitychange", () => { if(!document.hidden) sync(); }); }
  const snap = p => ({id:p.split("/").pop(), exists:cache.has(p), data:() => cache.get(p)});
  return {
    _call: call,
    async _resync(){ since = 0; cache.clear(); await sync(); notify(); },
    collection(path){ return { onSnapshot(next){ const run = () => next({docs:[...cache.keys()].filter(k => parent(k) === path).map(snap)}); subs.add(run); start(); if(ready) run(); return () => subs.delete(run); } }; },
    doc(path){ return {
      onSnapshot(next){ const run = () => next(snap(path)); subs.add(run); start(); if(ready) run(); return () => subs.delete(run); },
      async set(d){ await call("set", {path, data:d}); cache.set(path, d); notify(); },
      async update(d){ await call("update", {path, data:d}); cache.set(path, {...(cache.get(path)||{}), ...d}); notify(); },
      async delete(){ await call("delete", {path}); cache.delete(path); notify(); } }; }
  };
}

async function recStart(btn){

async function toWav16k(blob){
  const AC = window.AudioContext || window.webkitAudioContext, ac = new AC();
  const buf = await blob.arrayBuffer();
  const dec = await new Promise((res, rej) => { const p = ac.decodeAudioData(buf, res, rej); if(p && p.then) p.then(res, rej); });
  try{ ac.close(); }catch(_){}
  const rate = 16000, len = Math.max(1, Math.ceil(dec.duration * rate));
  const oc = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(1, len, rate);
  const src = oc.createBufferSource(); src.buffer = dec; src.connect(oc.destination); src.start();
  const pcm = (await oc.startRendering()).getChannelData(0);
  const ab = new ArrayBuffer(44 + pcm.length*2), v = new DataView(ab), ws = (o, s) => { for(let i = 0; i < s.length; i++) v.setUint8(o+i, s.charCodeAt(i)); };
  ws(0,"RIFF"); v.setUint32(4, 36 + pcm.length*2, true); ws(8,"WAVE"); ws(12,"fmt "); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true); v.setUint32(24,rate,true); v.setUint32(28,rate*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); ws(36,"data"); v.setUint32(40, pcm.length*2, true);
  for(let i = 0; i < pcm.length; i++){ const s = Math.max(-1, Math.min(1, pcm[i])); v.setInt16(44 + i*2, s < 0 ? s*0x8000 : s*0x7fff, true); }
  return new File([ab], "voice-note.wav", {type:"audio/wav"});
}

    if(HOSTED){ try{ const up = await S.db._call("upload", {name:file.name, data:await fileToBase64(file)}); pdf_url = up.url; }catch(e){} }
    else if(S.assets){ try{ const up = await S.assets.upload(file); pdf_url = up.url; }catch(e){} }
    const out = await runFlow("Report In", {pdf_base64: await fileField(file), title:file.name.replace(/\.pdf$/i,"")}, "Report Result");
    if(!out.ok) throw {message:"No text could be read from that PDF."};
    const m = file.name.match(/(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*[_\s-]*(\d{2,4})/i);
    const month = m ? `20${m[2].slice(-2)}-${String(["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"].indexOf(m[1].toLowerCase().slice(0,3))+1).padStart(2,"0")}` : new Date().toISOString().slice(0,7);
    const outlook = extractOutlook(out.markdown);
    const dom = outlook.match(/Domestic Sugar (?:Price )?Outlook[\s\S]*?Short Term[\s\S]*?(₹[\d,]+\s*[–-]\s*₹?[\d,]+)/i);
    await save("reports/"+month, {month, title:`AgriMandi Sugar Report, ${monthLabel(month)}`, outlook, domestic_range: dom ? "Kolhapur S-grade " + dom[1] + "/qtl, next month" : "", markdown:String(out.markdown).slice(0,150000), pdf_url, uploaded_at:new Date().toISOString(), uploaded_by:S.me.id});
    toast("Report converted and saved");
  }catch(err){ S.err.report = err.code==="too_big" ? err.message : mcpMessage(err); }
  S.busy.report = false; render();
}
async function importSales(file){
  S.err.sales = "";
  try{
    const text = await file.text(); const lines = text.split(/\r?\n/).filter(l => l.trim()); if(lines.length < 2) throw new Error("The file has no data rows.");
    const split = l => { const out = []; let cur = "", qd = false; for(const ch of l){ if(ch === '"'){ qd = !qd; } else if(ch === "," && !qd){ out.push(cur.trim()); cur = ""; } else cur += ch; } out.push(cur.trim()); return out; };
    const head = split(lines[0]).map(h => h.toLowerCase());
    const find = re => head.findIndex(h => re.test(h));
    const iM = find(/month|date|period/), iMill = find(/code|mill|unit|factory/), iQ = find(/qty|quantity|sold|volume/), iP = find(/price|rate|realis/);
    if(iM < 0 || iQ < 0) throw new Error("Could not find month/date and quantity columns.");
    const agg = {};
    lines.slice(1).forEach(l => { const c = split(l); const raw = c[iM] || ""; const d = new Date(raw); const mk = /^\d{4}-\d{2}/.test(raw) ? raw.slice(0,7) : !isNaN(d) ? d.toISOString().slice(0,7) : null; if(!mk) return;
      const mill = iMill >= 0 ? c[iMill] : "all"; const k = mk + "_" + String(mill).replace(/[^\w-]/g,""); const qn = num(String(c[iQ]).replace(/,/g,"")), pr = iP >= 0 ? num(String(c[iP]).replace(/,/g,"")) : 0;
      (agg[k] = agg[k] || {month:mk, mill, qty:0, val:0}); agg[k].qty += qn; agg[k].val += qn*pr; });
    const docs = Object.entries(agg); if(!docs.length) throw new Error("No rows could be read.");
    for(const [k,v] of docs) await saveC("sales/"+k, {month:v.month, mill:v.mill, qty:Math.round(v.qty), avg_price:v.qty?Math.round(v.val/v.qty):null});
    toast(`Imported ${docs.length} monthly rows`);
  }catch(err){ S.err.sales = err.message || "Could not read that file."; render(); }
}

boot();
})();
